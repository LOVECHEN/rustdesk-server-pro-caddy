name: build-image

# 多架构构建 rustdesk-server-pro-caddy 并推送到 Docker Hub。
# 需在仓库 Settings → Secrets 里配：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN。
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entry'
      - 'caddy-run'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      rustdesk_ver:
        description: '官方 RustDesk Server Pro 版本 tag（latest 或如 1.1.14）'
        required: false
        default: 'latest'
      platforms:
        description: '目标架构'
        required: false
        default: 'linux/amd64,linux/arm64,linux/arm/v7'

env:
  REPO: lovechen/rustdesk-server-pro-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本 / tag
        id: meta
        run: |
          VER="${{ github.event.inputs.rustdesk_ver || 'latest' }}"
          PLAT="${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}"
          TAGS="${REPO}:latest"
          if [ "$VER" != "latest" ]; then TAGS="${TAGS},${REPO}:${VER}"; fi
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"
          echo "plat=$PLAT" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "RustDesk 版本=$VER  架构=$PLAT  tags=$TAGS"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送（多架构 manifest）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.meta.outputs.plat }}
          build-args: |
            RUSTDESK_VER=${{ steps.meta.outputs.ver }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
          sbom: false

      - name: 摘要
        run: |
          echo "### ✅ 已推送 ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构：${{ steps.meta.outputs.plat }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 源二进制：rustdesk/rustdesk-server-pro-s6:${{ steps.meta.outputs.ver }}（原版）" >> "$GITHUB_STEP_SUMMARY"
