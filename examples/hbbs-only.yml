# 仅信令 hbbs —— 经典单进程模式：command=hbbs → 直接 exec，PID1 就是 hbbs，【无 s6、无常驻 shell】。
#   等价官方经典版 rustdesk-server-pro 的单 hbbs 部署。中继另配（见 hbbr-only.yml）。
services:
  hbbs:
    container_name: rustdesk-hbbs
    hostname: rustdesk-hbbs
    image: lovechen/rustdesk-server-pro-caddy:latest
    command: ["hbbs"]
    volumes:
      - ./data:/data
    ports:
      - "21114:21114"      # Web 控制台(Pro)
      - "21115:21115"      # NAT type test
      - "21116:21116"      # TCP 打洞/连接
      - "21116:21116/udp"  # ID 注册/心跳
      # - "21118:21118"    # Web client(hbbs)
    # environment:
      # - KEY_PUB=<id_ed25519.pub>
      # - KEY_PRIV=<id_ed25519 私钥>
      # - RELAY=1.2.3.4        # 中继地址(指向你的 hbbr 机器)
    restart: unless-stopped
